<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M. Zain ul Abideen | Web Developer & Designer</title>
  <style>
:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --muted:#6b7280;
  --accent:#0b63d6;
  --text:#0f1724;
  --maxw:900px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  background:linear-gradient(180deg, #eef2ff 0%, var(--bg) 100%);
  color:var(--text);
  padding:24px;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.container{max-width:var(--maxw);margin:0 auto}
.header{display:flex;gap:18px;align-items:center;margin-bottom:18px}
.avatar{width:120px;height:120px;border-radius:12px;object-fit:cover;border:4px solid white;box-shadow:0 8px 20px rgba(11,99,214,0.08)}
.header-info h1{margin:0;font-size:1.6rem}
.header-info .bio{margin:6px 0;color:var(--muted)}
.meta{color:var(--muted);margin-top:6px}
.meta.small{font-size:0.9rem;color:var(--muted)}
.card{background:var(--card);padding:16px;border-radius:10px;box-shadow:0 6px 20px rgba(16,24,40,0.04);margin-bottom:14px}
.card h2{margin-top:0}
.repos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.repo-card{padding:12px;border-radius:8px;background:#fbfdff;border:1px solid #eef2ff}
.repo-title{font-weight:600;color:var(--accent);text-decoration:none}
.repo-desc{margin:6px 0;color:var(--muted);font-size:0.95rem}
.repo-meta{font-size:0.85rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.lang-pill{display:inline-block;background:#f1f5f9;color:#0f1724;padding:6px 10px;border-radius:999px;margin:6px 6px 0 0;font-size:0.85rem}
.footer{margin-top:8px;text-align:center}
.muted{color:var(--muted)}

.readme{line-height:1.6}
.readme h1,.readme h2,.readme h3{color:var(--text);margin-top:0.75rem}
.readme pre{background:#0b1220;color:#e6f1ff;padding:12px;border-radius:8px;overflow:auto}
.readme code{background:#f1f5f9;padding:2px 6px;border-radius:6px}
.readme img{max-width:100%;height:auto;border-radius:8px;margin:6px 0}
.readme a{color:var(--accent);text-decoration:none}

@media print{
  body{background:white;padding:0}
  .header{page-break-inside:avoid}
  .repos-grid{page-break-inside:avoid}
  .avatar{width:96px;height:96px}
  .container{max-width:700px}
}
  </style>
</head>

<body>

<!-- Your existing HTML content stays exactly the same -->
<!-- Navigation, Hero, About, Skills, Projects, Education, Community, Contact, Footer -->

<!-- JS remains unchanged -->
<script>
/* Mobile Menu */
const menuToggle = document.querySelector('.menu-toggle');
const navLinks = document.querySelector('.nav-links');
const menuIcon = menuToggle?.querySelector('i');

menuToggle?.addEventListener('click', () => {
  navLinks.classList.toggle('active');
  menuIcon.classList.toggle('fa-bars');
  menuIcon.classList.toggle('fa-times');
});

/* Back to top */
const backToTop = document.querySelector('.back-to-top');
window.addEventListener('scroll', () => {
  backToTop?.classList.toggle('active', window.scrollY > 300);
});
backToTop?.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* Skill bars */
const skillBars = document.querySelectorAll('.skill-progress');
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.style.width = entry.target.dataset.width;
    }
  });
},{threshold:0.3});
skillBars.forEach(bar => observer.observe(bar));

/* Footer year */
document.getElementById('year')?.textContent = new Date().getFullYear();
</script>

</body>
</html>
